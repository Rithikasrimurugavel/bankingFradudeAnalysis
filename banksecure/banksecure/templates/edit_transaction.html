{% extends "base.html" %}

{% block title %}Edit Transaction - BankSecure{% endblock %}
{% block eyebrow %}TRANSACTION MANAGEMENT{% endblock %}
{% block heading %}Edit Transaction{% endblock %}

{% block content %}

    <section class="form-section">

        <h2>Update Transaction Details</h2>

        <form action="/update-transaction/{{ transaction[0] }}" method="POST">

            <div class="form-group">
                <label>Select Account</label>
                <select name="account_id" required>
                    {% for account in accounts %}
                    <option value="{{ account[0] }}" {% if account[0] == transaction[1] %}selected{% endif %}>
                        {{ account[1] }} (Account: {{ account[2] }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Select Merchant</label>
                <select name="merchant_id" required>
                    {% for merchant in merchants %}
                    <option value="{{ merchant[0] }}" {% if merchant[0] == transaction[2] %}selected{% endif %}>
                        {{ merchant[1] }} - {{ merchant[2] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Transaction Amount</label>
                <input type="number" name="transaction_amount" value="{{ transaction[3] }}" step="0.01" min="0.01" required>
            </div>

            <div class="form-group">
                <label>Transaction Type</label>
                <select name="transaction_type" required>
                    {% for t in ["Debit", "Credit", "Transfer", "Payment"] %}
                    <option value="{{ t }}" {% if transaction[4] == t %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Transaction Date & Time</label>
                <input type="datetime-local" name="transaction_time" value="{{ transaction[5] }}" required>
            </div>

            <div class="form-group">
                <label>Transaction Location</label>
                <input type="text" name="location" value="{{ transaction[6] }}">
            </div>

            <button type="submit" class="save-btn">Update Transaction</button>
            <a href="/transactions" class="view-all-btn">Cancel</a>

        </form>

    </section>

{% endblock %}
